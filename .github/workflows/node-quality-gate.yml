name: Node Quality Gate

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for project commands
        required: false
        type: string
        default: "20"
      checkout-ref:
        description: Optional caller repository ref/tag/SHA to verify
        required: false
        type: string
        default: ""
      run-tests:
        required: false
        type: boolean
        default: true
      test-command:
        required: false
        type: string
        default: "npm test"
      verify-command:
        description: Optional domain-specific verification command
        required: false
        type: string
        default: ""
      run-typecheck:
        required: false
        type: boolean
        default: true
      typecheck-command:
        required: false
        type: string
        default: "npm run check"
      run-audit:
        required: false
        type: boolean
        default: true
      audit-level:
        required: false
        type: string
        default: "high"
      run-build:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: "npm run build"

permissions:
  contents: read

jobs:
  quality:
    name: Node Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Domain verification
        if: ${{ inputs.verify-command != '' }}
        run: ${{ inputs.verify-command }}

      - name: Tests
        if: ${{ inputs.run-tests }}
        run: ${{ inputs.test-command }}

      - name: TypeScript check
        if: ${{ inputs.run-typecheck }}
        run: ${{ inputs.typecheck-command }}

      - name: Dependency audit
        if: ${{ inputs.run-audit }}
        run: npm audit --audit-level=${{ inputs.audit-level }}

      - name: Production build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-command }}
