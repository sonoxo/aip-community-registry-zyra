name: Verify GPT-GlassOnion feature branch

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/verify-gpt-glassonion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-glassonion-feature
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GlassOnion feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/gpt-glassonion
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: GPT-GlassOnion/osdk_app/package.json
      - name: Install dependencies
        working-directory: GPT-GlassOnion/osdk_app
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript runtime and evidence
        working-directory: GPT-GlassOnion/osdk_app
        run: npm run quality
      - name: Upload deployment-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: glassonion-feature-readiness
          path: GPT-GlassOnion/osdk_app/dist/evidence/deployment-readiness.json
          if-no-files-found: error
          retention-days: 30
